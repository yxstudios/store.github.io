<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header"><h1>Nueva Contraseña</h1></div>
            <form id="resetForm">
                <div class="form-group"><label><span class="material-icons">lock</span> Nueva</label><div class="input-wrapper"><span class="material-icons input-icon">lock</span><input type="password" id="newPassword" required minlength="6"></div></div>
                <div class="form-group"><label><span class="material-icons">lock_reset</span> Confirmar</label><div class="input-wrapper"><span class="material-icons input-icon">lock_reset</span><input type="password" id="confirmPassword" required minlength="6"></div></div>
                <button type="submit" class="btn-primary"><span class="material-icons">save</span> Guardar</button>
            </form>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('authMessage');
            if (p1 !== p2) { msg.textContent = 'No coinciden'; msg.className = 'auth-message error'; return; }
            const { error } = await supabase.auth.updateUser({ password: p1 });
            if (error) { msg.textContent = error.message; msg.className = 'auth-message error'; }
            else { msg.textContent = 'Contraseña actualizada'; msg.className = 'auth-message success'; setTimeout(() => window.location.href = 'login.html', 1500); }
        });
    </script>
</body>
</html>
