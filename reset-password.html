<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <span class="material-icons logo-icon">sports_esports</span>
                    <h1>YX Studios</h1>
                </div>
                <p>Restablece tu contraseña</p>
            </div>
            
            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">
                        <span class="material-icons">lock</span> Nueva contraseña
                    </label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">lock</span>
                        <input type="password" id="newPassword" placeholder="Nueva contraseña" required minlength="6">
                        <span class="material-icons toggle-password" data-target="newPassword">visibility_off</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">
                        <span class="material-icons">lock_reset</span> Confirmar contraseña
                    </label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">lock_reset</span>
                        <input type="password" id="confirmPassword" placeholder="Repite la contraseña" required minlength="6">
                        <span class="material-icons toggle-password" data-target="confirmPassword">visibility_off</span>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">
                    <span class="material-icons">save</span> Guardar nueva contraseña
                </button>
            </form>
            
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('authMessage');
            
            if (newPassword !== confirmPassword) {
                msg.textContent = 'Las contraseñas no coinciden';
                msg.className = 'auth-message error';
                return;
            }
            
            const { error } = await supabase.auth.updateUser({ password: newPassword });
            
            if (error) {
                msg.textContent = error.message;
                msg.className = 'auth-message error';
            } else {
                msg.textContent = 'Contraseña actualizada. Redirigiendo...';
                msg.className = 'auth-message success';
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
        
        // Toggle password
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = document.getElementById(this.dataset.target);
                if (target.type === 'password') {
                    target.type = 'text';
                    this.textContent = 'visibility';
                } else {
                    target.type = 'password';
                    this.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body>
</html>
