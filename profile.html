<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="theme-switcher">
        <div class="theme-toggle-btn"><i class="fas fa-palette"></i></div>
        <div class="theme-panel">
            <h4><i class="fas fa-paint-brush"></i> Temas</h4>
            <div class="theme-options">
                <button class="theme-option active" data-theme="red"><span class="theme-color red-theme"></span>Red</button>
                <button class="theme-option" data-theme="dark-gray"><span class="theme-color dark-gray-theme"></span>Dark</button>
                <button class="theme-option" data-theme="blue"><span class="theme-color blue-theme"></span>Blue</button>
                <button class="theme-option" data-theme="purple"><span class="theme-color purple-theme"></span>Purple</button>
            </div>
        </div>
    </div>

    <nav class="topbar">
        <div class="topbar-container">
            <div class="topbar-brand"><a href="index.html"><span class="material-icons">sports_esports</span>YX Studios</a></div>
            <div class="topbar-nav">
                <a href="index.html" class="nav-link"><span class="material-icons">home</span>Home</a>
                <a href="cart.html" class="nav-link cart-link"><span class="material-icons">shopping_cart</span>Carrito<span id="cartCount" class="cart-badge">0</span></a>
                <a href="profile.html" class="nav-link active"><span class="material-icons">person</span>Perfil</a>
                <a href="#" id="logoutBtn" class="btn-login"><span class="material-icons">logout</span>Salir</a>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <div class="profile-sidebar">
            <div class="profile-avatar-section">
                <img id="profileAvatar" src="https://via.placeholder.com/120" class="profile-avatar">
                <h2 id="profileName">Usuario</h2>
                <p id="profileEmail">email</p>
            </div>
            <nav class="profile-nav">
                <a href="#" class="profile-nav-link active" data-section="info"><span class="material-icons">person</span> Información</a>
                <a href="#" class="profile-nav-link" data-section="purchases"><span class="material-icons">shopping_bag</span> Mis Compras</a>
                <a href="#" class="profile-nav-link" data-section="settings"><span class="material-icons">settings</span> Configuración</a>
            </nav>
        </div>
        <div class="profile-content">
            <div id="infoSection" class="profile-section active">
                <h3>Información Personal</h3>
                <div class="profile-form">
                    <div class="form-group"><label>Nombre</label><input type="text" id="editName" class="profile-input"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="editEmail" class="profile-input" disabled></div>
                    <button class="btn-primary" id="saveProfile"><span class="material-icons">save</span> Guardar</button>
                </div>
            </div>
            <div id="purchasesSection" class="profile-section"><h3>Mis Compras</h3><div id="purchasesList"><p class="text-muted">No tienes compras</p></div></div>
            <div id="settingsSection" class="profile-section"><h3>Configuración</h3><div class="settings-options"><button class="btn-outline" id="changePasswordBtn"><span class="material-icons">lock</span> Cambiar Contraseña</button></div></div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadProfile() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            const user = session.user;
            document.getElementById('profileName').textContent = user.user_metadata?.full_name || 'Usuario';
            document.getElementById('profileEmail').textContent = user.email;
            document.getElementById('editName').value = user.user_metadata?.full_name || '';
            document.getElementById('editEmail').value = user.email;
            if (user.user_metadata?.avatar_url) document.getElementById('profileAvatar').src = user.user_metadata.avatar_url;
            loadPurchases();
        }

        function loadPurchases() {
            const orders = JSON.parse(localStorage.getItem('yxOrders') || '[]');
            const list = document.getElementById('purchasesList');
            if (!orders.length) { list.innerHTML = '<p class="text-muted">No tienes compras</p>'; return; }
            list.innerHTML = orders.map(o => '<div class="purchase-card"><div class="purchase-header"><span>Pedido: ' + o.id.substring(0, 10) + '...</span><span>' + new Date(o.date).toLocaleDateString() + '</span></div><div class="purchase-total"><span>Total: $' + o.total.toFixed(2) + '</span></div></div>').join('');
        }

        document.querySelectorAll('.profile-nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.profile-nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                document.querySelectorAll('.profile-section').forEach(s => s.classList.remove('active'));
                document.getElementById(link.dataset.section + 'Section').classList.add('active');
            });
        });

        if (window.location.hash === '#purchases') document.querySelector('[data-section="purchases"]').click();
        if (window.location.hash === '#settings') document.querySelector('[data-section="settings"]').click();

        document.getElementById('saveProfile').addEventListener('click', async () => {
            const name = document.getElementById('editName').value;
            await supabase.auth.updateUser({ data: { full_name: name } });
            document.getElementById('profileName').textContent = name;
            alert('Perfil actualizado');
        });

        document.getElementById('changePasswordBtn').addEventListener('click', async () => {
            const email = document.getElementById('editEmail').value;
            await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password.html' });
            alert('Revisa tu correo');
        });

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });

        const cart = JSON.parse(localStorage.getItem('yxCart') || '[]');
        const count = cart.reduce((s, i) => s + (i.quantity || 1), 0);
        const badge = document.getElementById('cartCount');
        if (badge) { badge.textContent = count; badge.style.display = count > 0 ? 'flex' : 'none'; }

        loadProfile();
    </script>
</body>
</html>
