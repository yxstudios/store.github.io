<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - YX Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-home"><span class="material-icons">arrow_back</span> Volver al inicio</a>
            <div class="auth-header">
                <div class="logo"><span class="material-icons logo-icon">sports_esports</span><h1>YX Studios</h1></div>
                <p>Inicia sesión para continuar</p>
            </div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label><span class="material-icons">email</span> Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">email</span>
                        <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label><span class="material-icons">lock</span> Contraseña</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">lock</span>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <span class="material-icons toggle-password" data-target="loginPassword">visibility_off</span>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox"> Recordarme</label>
                    <a href="#" class="forgot-password" id="showForgotPassword">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-primary"><span class="material-icons">login</span> Iniciar Sesión</button>
                <div class="divider"><span>o continúa con</span></div>
                <button type="button" id="discordLogin" class="btn-discord"><i class="fab fa-discord"></i> Continuar con Discord</button>
            </form>
            <form id="forgotPasswordForm" class="auth-form" style="display:none;">
                <h3 style="text-align:center;margin-bottom:15px;">Restablecer Contraseña</h3>
                <p style="text-align:center;color:var(--text-secondary);margin-bottom:20px;font-size:0.9em;">Ingresa tu correo y te enviaremos un enlace.</p>
                <div class="form-group">
                    <label><span class="material-icons">email</span> Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">email</span>
                        <input type="email" id="resetEmail" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary"><span class="material-icons">send</span> Enviar enlace</button>
                <div style="text-align:center;margin-top:15px;"><a href="#" id="backToLogin" style="color:var(--accent);">Volver al inicio de sesión</a></div>
            </form>
            <div class="auth-footer"><p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p></div>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
