<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - YX Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-home"><span class="material-icons">arrow_back</span> Volver al inicio</a>
            <div class="auth-header">
                <div class="logo"><span class="material-icons logo-icon">sports_esports</span><h1>YX Studios</h1></div>
                <p>Inicia sesión para continuar</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label><span class="material-icons">email</span> Correo</label>
                    <div class="input-wrapper"><span class="material-icons input-icon">email</span><input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required></div>
                </div>
                <div class="form-group">
                    <label><span class="material-icons">lock</span> Contraseña</label>
                    <div class="input-wrapper"><span class="material-icons input-icon">lock</span><input type="password" id="loginPassword" placeholder="••••••••" required></div>
                </div>
                <button type="submit" class="btn-primary"><span class="material-icons">login</span> Iniciar Sesión</button>
                <div class="divider"><span>o continúa con</span></div>
                <button type="button" id="discordLogin" class="btn-discord"><i class="fab fa-discord"></i> Continuar con Discord</button>
            </form>
            <div class="auth-footer"><p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p></div>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script>
        var BASE_URL = 'https://yxstore.linkpc.net';
        
        // Discord
        document.getElementById('discordLogin').addEventListener('click', async function() {
            var { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            var supabase = createClient(
                'https://qfgofnlvfxcmzexwuzou.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZ29mbmx2ZnhjbXpleHd1em91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjMxNDEsImV4cCI6MjEwMTczOTE0MX0.f-DaLy6effZWpCln1z_Ib2aHBAEs0SGjcqx647PlZCc'
            );
            var { error } = await supabase.auth.signInWithOAuth({
                provider: 'discord',
                options: { redirectTo: BASE_URL + '/index.html' }
            });
            if (error) {
                document.getElementById('authMessage').textContent = error.message;
                document.getElementById('authMessage').className = 'auth-message error';
            }
        });
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('loginEmail').value.trim();
            var password = document.getElementById('loginPassword').value;
            var msgEl = document.getElementById('authMessage');
            
            var { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            var supabase = createClient(
                'https://qfgofnlvfxcmzexwuzou.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZ29mbmx2ZnhjbXpleHd1em91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjMxNDEsImV4cCI6MjEwMTczOTE0MX0.f-DaLy6effZWpCln1z_Ib2aHBAEs0SGjcqx647PlZCc'
            );
            
            var { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
            
            if (error) {
                msgEl.textContent = error.message;
                msgEl.className = 'auth-message error';
            } else {
                msgEl.textContent = 'Inicio de sesión exitoso.';
                msgEl.className = 'auth-message success';
                setTimeout(function() { window.location.href = BASE_URL + '/index.html'; }, 1000);
            }
        });
    </script>
</body>
</html>
