<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <div class="theme-toggle-btn">
            <i class="fas fa-palette"></i>
        </div>
        <div class="theme-panel">
            <h4><i class="fas fa-paint-brush"></i> Personalizar Tema</h4>
            <div class="theme-options">
                <button class="theme-option active" data-theme="red">
                    <span class="theme-color red-theme"></span>
                    <span>Red Passion</span>
                </button>
                <button class="theme-option" data-theme="dark-gray">
                    <span class="theme-color dark-gray-theme"></span>
                    <span>Dark Steel</span>
                </button>
                <button class="theme-option" data-theme="blue">
                    <span class="theme-color blue-theme"></span>
                    <span>Ocean Blue</span>
                </button>
                <button class="theme-option" data-theme="purple">
                    <span class="theme-color purple-theme"></span>
                    <span>Royal Purple</span>
                </button>
            </div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-home">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
                <div class="logo">
                    <i class="fas fa-gamepad"></i>
                    <h1>YX Studios</h1>
                </div>
                <p>¡Bienvenido de nuevo! Inicia sesión para continuar</p>
            </div>
            
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> Correo electrónico
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Recordarme</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
                
                <div class="divider">
                    <span>o continúa con</span>
                </div>
                
                <button type="button" id="googleLogin" class="btn-google">
                    <img src="https://www.google.com/favicon.ico" alt="Google" class="google-icon">
                    Continuar con Google
                </button>
            </form>
            
            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
            
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
