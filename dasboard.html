<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - RBX Systems</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-gamepad"></i>
            <span>RBX Systems</span>
        </div>
        <div class="nav-menu">
            <a href="products.html"><i class="fas fa-store"></i> Productos</a>
            <a href="dashboard.html" class="active"><i class="fas fa-user"></i> Mi Cuenta</a>
            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Salir</a>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="dashboard-header">
            <div class="user-card">
                <img id="userAvatar" src="https://via.placeholder.com/100" alt="Avatar" class="avatar">
                <div class="user-info">
                    <h2 id="userName">Usuario</h2>
                    <p id="userEmail">email@ejemplo.com</p>
                    <span class="badge" id="membershipBadge">Miembro</span>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <i class="fas fa-shopping-cart"></i>
                <h3>Mis Compras</h3>
                <p class="stat" id="purchaseCount">0</p>
                <p>Productos adquiridos</p>
            </div>
            
            <div class="dashboard-card">
                <i class="fas fa-star"></i>
                <h3>Mis Productos</h3>
                <p class="stat" id="favoriteCount">0</p>
                <p>Favoritos</p>
            </div>
            
            <div class="dashboard-card">
                <i class="fas fa-coins"></i>
                <h3>Puntos</h3>
                <p class="stat" id="pointsBalance">0</p>
                <p>RBX Points</p>
            </div>
        </div>

        <div class="recent-activity">
            <h3><i class="fas fa-history"></i> Actividad Reciente</h3>
            <div id="activityList" class="activity-list">
                <p class="empty-state">No hay actividad reciente</p>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
