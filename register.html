<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - YX Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onLoadTurnstile" defer></script>
</head>
<body>

    <div class="theme-switcher">
        <div class="theme-toggle-btn"><i class="fas fa-palette"></i></div>
        <div class="theme-panel">
            <h4><i class="fas fa-paint-brush"></i> Personalizar Tema</h4>
            <div class="theme-options">
                <button class="theme-option active" data-theme="red"><span class="theme-color red-theme"></span><span>Red Passion</span></button>
                <button class="theme-option" data-theme="dark-gray"><span class="theme-color dark-gray-theme"></span><span>Dark Steel</span></button>
                <button class="theme-option" data-theme="blue"><span class="theme-color blue-theme"></span><span>Ocean Blue</span></button>
                <button class="theme-option" data-theme="purple"><span class="theme-color purple-theme"></span><span>Royal Purple</span></button>
            </div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-home"><span class="material-icons">arrow_back</span> <span data-i18n="back_home">Volver al inicio</span></a>
            <div class="auth-header">
                <div class="logo"><span class="material-icons logo-icon">sports_esports</span><h1>YX Studios</h1></div>
                <p data-i18n="register_title">Crea tu cuenta y comienza a comprar</p>
            </div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label><span class="material-icons">person</span> <span data-i18n="name_label">Nombre completo</span></label>
                    <div class="input-wrapper"><span class="material-icons input-icon">person</span><input type="text" id="registerName" data-i18n="name_placeholder" placeholder="Tu nombre completo" required></div>
                </div>
                <div class="form-group">
                    <label><span class="material-icons">email</span> <span data-i18n="email_label">Correo electrónico</span></label>
                    <div class="input-wrapper"><span class="material-icons input-icon">email</span><input type="email" id="registerEmail" data-i18n="email_placeholder" placeholder="ejemplo@correo.com" required></div>
                </div>
                <div class="form-group">
                    <label><span class="material-icons">lock</span> <span data-i18n="password_label">Contraseña</span></label>
                    <div class="input-wrapper"><span class="material-icons input-icon">lock</span><input type="password" id="registerPassword" data-i18n="password_placeholder" placeholder="Mínimo 6 caracteres" required minlength="6"><span class="material-icons toggle-password" data-target="registerPassword">visibility_off</span></div>
                </div>
                <div class="password-strength"><div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div><span class="strength-text" id="strengthText" data-i18n="password_strength">Fortaleza de la contraseña</span></div>
                <div id="turnstile-container" style="margin-bottom:20px;display:flex;justify-content:center;min-height:65px;"></div>
                <div class="terms-checkbox"><label><input type="checkbox" id="termsCheck" required> <span data-i18n="accept_terms">Acepto los <a href="#">Términos y Condiciones</a></span></label></div>
                <button type="submit" class="btn-primary"><span class="material-icons">person_add</span> <span data-i18n="register_btn">Crear Cuenta</span></button>
                <div class="divider"><span data-i18n="or_continue">o regístrate con</span></div>
                <button type="button" id="discordRegister" class="btn-discord"><i class="fab fa-discord"></i> <span data-i18n="discord_btn">Continuar con Discord</span></button>
            </form>
            <div class="auth-footer"><p><span data-i18n="have_account">¿Ya tienes una cuenta?</span> <a href="login.html" data-i18n="login_here">Inicia sesión aquí</a></p></div>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/theme.js"></script>
    <script>
        applyTranslations();
        var captchaToken = null;
        window.onLoadTurnstile = function() {
            if (typeof turnstile !== 'undefined') {
                turnstile.render('#turnstile-container', { sitekey: '0x4AAAAAAELVyefNkoTULHXV', theme: 'dark', callback: function(token) { captchaToken = token; } });
            }
        };
        document.getElementById('discordRegister').addEventListener('click', async function() {
            var { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            var supabase = createClient('https://qfgofnlvfxcmzexwuzou.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZ29mbmx2ZnhjbXpleHd1em91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjMxNDEsImV4cCI6MjEwMTczOTE0MX0.f-DaLy6effZWpCln1z_Ib2aHBAEs0SGjcqx647PlZCc');
            await supabase.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: 'https://yxstore.linkpc.net/index.html' } });
        });
        document.querySelectorAll('.toggle-password').forEach(function(btn) {
            btn.addEventListener('click', function() { var t = document.getElementById(this.dataset.target); if (t) { t.type = t.type === 'password' ? 'text' : 'password'; this.textContent = t.type === 'password' ? 'visibility_off' : 'visibility'; } });
        });
        document.getElementById('registerPassword').addEventListener('input', function() {
            var p = this.value, f = document.getElementById('strengthFill'), t = document.getElementById('strengthText');
            if (!f || !t) return; var s = 0;
            if (p.length >= 6) s++; if (p.length >= 8) s++; if (/[A-Z]/.test(p)) s++; if (/[0-9]/.test(p)) s++;
            var pcts = ['0%','25%','50%','75%','100%'], colors = ['#ff1744','#ff9100','#ffd600','#76ff03','#00e676'];
            f.style.width = pcts[s] || '0%'; f.style.background = colors[s] || colors[0];
        });
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var name = document.getElementById('registerName').value.trim(), email = document.getElementById('registerEmail').value.trim(), password = document.getElementById('registerPassword').value;
            var msg = document.getElementById('authMessage');
            if (!document.getElementById('termsCheck').checked) { msg.textContent = t('accept_terms_error') || 'Debes aceptar los términos.'; msg.className = 'auth-message error'; return; }
            if (!captchaToken) { msg.textContent = t('captcha_error') || 'Completa la verificación de seguridad.'; msg.className = 'auth-message error'; return; }
            var { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
            var supabase = createClient('https://qfgofnlvfxcmzexwuzou.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmZ29mbmx2ZnhjbXpleHd1em91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjMxNDEsImV4cCI6MjEwMTczOTE0MX0.f-DaLy6effZWpCln1z_Ib2aHBAEs0SGjcqx647PlZCc');
            var { error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: name }, captchaToken } });
            if (error) { msg.textContent = error.message; msg.className = 'auth-message error'; if (typeof turnstile !== 'undefined') turnstile.reset('#turnstile-container'); captchaToken = null; }
            else { msg.textContent = t('account_created') || 'Cuenta creada exitosamente.'; msg.className = 'auth-message success'; setTimeout(function() { window.location.href = 'https://yxstore.linkpc.net/index.html'; }, 1000); }
        });
    </script>
</body>
</html>
