<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-home"><span class="material-icons">arrow_back</span> Volver</a>
            <div class="auth-header"><div class="logo"><span class="material-icons logo-icon">sports_esports</span><h1>YX Studios</h1></div><p>Crea tu cuenta</p></div>
            <form id="registerForm" class="auth-form">
                <div class="form-group"><label><span class="material-icons">person</span> Nombre</label><div class="input-wrapper"><span class="material-icons input-icon">person</span><input type="text" id="registerName" required></div></div>
                <div class="form-group"><label><span class="material-icons">email</span> Email</label><div class="input-wrapper"><span class="material-icons input-icon">email</span><input type="email" id="registerEmail" required></div></div>
                <div class="form-group"><label><span class="material-icons">lock</span> Contraseña</label><div class="input-wrapper"><span class="material-icons input-icon">lock</span><input type="password" id="registerPassword" required minlength="6"><span class="material-icons toggle-password" data-target="registerPassword">visibility_off</span></div></div>
                <div class="terms-checkbox"><label><input type="checkbox" required> Acepto los <a href="#">Términos</a></label></div>
                <button type="submit" class="btn-primary"><span class="material-icons">person_add</span> Crear Cuenta</button>
                <div class="divider"><span>o</span></div>
                <button type="button" id="discordRegister" class="btn-discord"><i class="fab fa-discord"></i> Discord</button>
            </form>
            <div class="auth-footer"><p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></div>
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
