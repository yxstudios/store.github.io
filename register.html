<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - YX Studios</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <div class="theme-toggle-btn">
            <i class="fas fa-palette"></i>
        </div>
        <div class="theme-panel">
            <h4><i class="fas fa-paint-brush"></i> Personalizar Tema</h4>
            <div class="theme-options">
                <button class="theme-option active" data-theme="red">
                    <span class="theme-color red-theme"></span>
                    <span>Red Passion</span>
                </button>
                <button class="theme-option" data-theme="dark-gray">
                    <span class="theme-color dark-gray-theme"></span>
                    <span>Dark Steel</span>
                </button>
                <button class="theme-option" data-theme="blue">
                    <span class="theme-color blue-theme"></span>
                    <span>Ocean Blue</span>
                </button>
                <button class="theme-option" data-theme="purple">
                    <span class="theme-color purple-theme"></span>
                    <span>Royal Purple</span>
                </button>
            </div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-home">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
                <div class="logo">
                    <i class="fas fa-gamepad"></i>
                    <h1>YX Studios</h1>
                </div>
                <p>Crea tu cuenta y comienza a comprar sistemas increíbles</p>
            </div>
            
            <form id="registerForm" class="auth-form active">
                <div class="form-group">
                    <label for="registerName">
                        <i class="fas fa-user"></i> Nombre completo
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="registerName" placeholder="Tu nombre completo" required autocomplete="name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">
                        <i class="fas fa-envelope"></i> Correo electrónico
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="registerEmail" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <i class="fas fa-eye toggle-password" data-target="registerPassword"></i>
                    </div>
                </div>
                
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Fortaleza de la contraseña</span>
                </div>
                
                <div class="terms-checkbox">
                    <label>
                        <input type="checkbox" id="termsCheck" required>
                        <span>Acepto los <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="fas fa-user-plus"></i> Crear Cuenta
                </button>
                
                <div class="divider">
                    <span>o regístrate con</span>
                </div>
                
                <button type="button" id="googleRegister" class="btn-google">
                    <img src="https://www.google.com/favicon.ico" alt="Google" class="google-icon">
                    Continuar con Google
                </button>
            </form>
            
            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
            
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
