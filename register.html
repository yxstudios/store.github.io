<!DOCTYPE html>
<html lang="es" data-theme="red">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - YX Studios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Turnstile se carga PRIMERO, sin async defer para que esté disponible -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" defer></script>
</head>
<body>

    <div class="theme-switcher">
        <div class="theme-toggle-btn"><i class="fas fa-palette"></i></div>
        <div class="theme-panel">
            <h4><i class="fas fa-paint-brush"></i> Personalizar Tema</h4>
            <div class="theme-options">
                <button class="theme-option active" data-theme="red"><span class="theme-color red-theme"></span><span>Red Passion</span></button>
                <button class="theme-option" data-theme="dark-gray"><span class="theme-color dark-gray-theme"></span><span>Dark Steel</span></button>
                <button class="theme-option" data-theme="blue"><span class="theme-color blue-theme"></span><span>Ocean Blue</span></button>
                <button class="theme-option" data-theme="purple"><span class="theme-color purple-theme"></span><span>Royal Purple</span></button>
            </div>
        </div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            
            <a href="index.html" class="back-home">
                <span class="material-icons">arrow_back</span> Volver al inicio
            </a>
            
            <div class="auth-header">
                <div class="logo">
                    <span class="material-icons logo-icon">sports_esports</span>
                    <h1>YX Studios</h1>
                </div>
                <p>Crea tu cuenta y comienza a comprar</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label><span class="material-icons">person</span> Nombre completo</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">person</span>
                        <input type="text" id="registerName" placeholder="Tu nombre completo" required autocomplete="name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label><span class="material-icons">email</span> Correo electrónico</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">email</span>
                        <input type="email" id="registerEmail" placeholder="ejemplo@correo.com" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label><span class="material-icons">lock</span> Contraseña</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">lock</span>
                        <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <span class="material-icons toggle-password" data-target="registerPassword">visibility_off</span>
                    </div>
                </div>
                
                <div class="password-strength">
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <span class="strength-text" id="strengthText">Fortaleza de la contraseña</span>
                </div>
                
                <!-- Turnstile Widget - se renderiza aquí -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAELVyefNkoTULHXV" data-theme="dark" data-callback="onCaptchaSuccess" style="margin-bottom:20px;display:flex;justify-content:center;"></div>
                
                <div class="terms-checkbox">
                    <label>
                        <input type="checkbox" id="termsCheck" required>
                        <span>Acepto los <a href="#">Términos y Condiciones</a></span>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary" id="registerBtn">
                    <span class="material-icons">person_add</span> Crear Cuenta
                </button>
                
                <div class="divider"><span>o regístrate con</span></div>
                
                <button type="button" id="discordRegister" class="btn-discord">
                    <i class="fab fa-discord"></i> Continuar con Discord
                </button>
            </form>
            
            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
            
            <div id="authMessage" class="auth-message"></div>
        </div>
    </div>

    <script>
        // Callback cuando se completa el captcha
        function onCaptchaSuccess(token) {
            console.log('Captcha completado');
            window.captchaToken = token;
        }
    </script>
    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
